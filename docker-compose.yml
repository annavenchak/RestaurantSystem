version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=super_secret_password pg_isready -U postgres_user -d my_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment:

      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/my_app_db
      - SPRING_DATASOURCE_USERNAME=postgres_user
      - SPRING_DATASOURCE_PASSWORD=super_secret_password


  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=my_app_db
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=super_secret_password
    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres_user -d my_app_db"]
      interval: 5s
      timeout: 5s
      retries: 5