spring.datasource.url=jdbc:postgresql://oop-postgres-server.postgres.database.azure.com:5432/restaurant_db

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:strwad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
app.api.key=${APP_API_KEY:default-dev-key}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
